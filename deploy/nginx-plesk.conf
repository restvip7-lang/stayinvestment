# Plesk → Сайты и домены → new.stayinvestment.com → Apache и nginx → «Дополнительные директивы nginx».
# Сайт работает как Node.js-приложение на 127.0.0.1:4330 (pm2), nginx только принимает запросы и отдаёт статику.
# Путь /var/www/vhosts/stayinvestment.com/new.stayinvestment.com — поправить под фактическую папку поддомена.

# Своя статика: имена с хешем / неизменяемые фото — кэш на год
location ^~ /_astro/ {
    alias /var/www/vhosts/stayinvestment.com/new.stayinvestment.com/dist/client/_astro/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
location ^~ /media/ {
    alias /var/www/vhosts/stayinvestment.com/new.stayinvestment.com/dist/client/media/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
location ~ ^/(images|fonts)/ {
    root /var/www/vhosts/stayinvestment.com/new.stayinvestment.com/dist/client;
    expires 30d;
    access_log off;
}

# Всё остальное — в Node.js. В Plesk выключить «Режим прокси» (Apache), иначе запросы уйдут в Apache.
# Регулярка ~ ^/ вместо «location /», чтобы не конфликтовать с одноимённым блоком самого Plesk.
location ~ ^/ {
    proxy_pass http://127.0.0.1:4330;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
