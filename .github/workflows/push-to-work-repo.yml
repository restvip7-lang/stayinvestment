# Отправка кода в рабочий репозиторий организации stayproperty-org/stayinvestment.
# Запускается только вручную (Actions → «Отправить в рабочий репозиторий» → Run workflow)
# или по команде Claude. Автоматически при пуше НЕ срабатывает.
#
# Нужен секрет ORG_PUSH_TOKEN в этом репозитории (Settings → Secrets and variables → Actions):
# fine-grained токен аккаунта staymng-bit с доступом Contents: Read and write к stayproperty-org/stayinvestment.
#
# Защита: если в рабочем репозитории есть коммиты, которых нет здесь, отправка останавливается —
# ничего не перезаписывается (никакого force-push).
name: Отправить в рабочий репозиторий

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Ветка в рабочем репозитории
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: push-to-work-repo
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код со всей историей
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Отправить в stayproperty-org/stayinvestment
        env:
          TOKEN: ${{ secrets.ORG_PUSH_TOKEN }}
          BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::Нет секрета ORG_PUSH_TOKEN. Добавьте его в Settings → Secrets and variables → Actions."
            exit 1
          fi
          if ! [[ "${BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Недопустимое имя ветки: ${BRANCH}"
            exit 1
          fi
          git remote add work "https://staymng-bit:${TOKEN}@github.com/stayproperty-org/stayinvestment.git"
          if git fetch --quiet work "${BRANCH}" 2>/dev/null; then
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "::error::В рабочем репозитории в ветке ${BRANCH} есть коммиты, которых нет здесь. Отправка остановлена, чтобы ничего не перезаписать."
              git log --oneline HEAD..FETCH_HEAD | head -20
              exit 1
            fi
            if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then
              echo "Рабочий репозиторий уже на этом коммите — отправлять нечего."
              exit 0
            fi
            echo "Новые коммиты для рабочего репозитория:"
            git log --oneline FETCH_HEAD..HEAD
          else
            echo "Ветки ${BRANCH} в рабочем репозитории нет — будет создана."
          fi
          git push work "HEAD:refs/heads/${BRANCH}"
          echo "### Отправлено в stayproperty-org/stayinvestment → ${BRANCH}: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
